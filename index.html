    <!-- Título da página -->
    <title>Bíblia Ilustrada por IA – Descubra Passagens com Inteligência Artificial</title>

    <!-- Seu arquivo CSS -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <!-- H1 principal do site -->
        <h1 class="font-reader">
            Bíbl<span id="logo">ia</span> ilustrada por <span id="logo">Inteligência Artificial</span>
        </h1>
        <br>
        <nav>
            <button class="chapter" onclick="HideOldTestament()">Antigo Testamento</button>
            <ul id="old-testament" style="display: none;">
                <!-- Nomes dos livros adicionados dinamicamente -->
            </ul>
            <button class="chapter" onclick="HideNewTestament()">Novo Testamento</button>
            <ul id="new-testament" style="display: none;">
                <!-- Nomes dos livros adicionados dinamicamente -->
            </ul>
            <div class="container" id="divChapters" style="display: none;">
                <p>Capítulos de <span  id="bookName">livro</span></p>
                <br>
                <ul id="chapters"></ul>
            </div>
            <div class="container" id="divVerses" style="display: none;">
                <p><span  id="bookNameChapter">livro - </span></p>
                <br>
                <ul id="verses"></ul>
            </div>
            <br><br>
            <div id="search">
                <input class="chapterSmall" placeholder="Procurar..." type="search" id="busca" value="">
            </div>
            <br><br>
        </nav>
    </header>
    
    <main>
        <article>
            <!-- Dialog para exibir a ilustração -->
            <dialog id="DialogMain">
                <fieldset>
                    <figure>
                        <!-- Atributo alt para acessibilidade e SEO de imagem -->
                        <img class="ilustrated" id="imgSelected" src="./imgs/1_1_2.jpg" alt="Ilustração bíblica gerada por Inteligência Artificial">
                    </figure>
                    <p class="font-reader ilustrated" id="legenda"></p>
                </fieldset>     
                <div class="dialogBtns">
                    <button class="chapterSpecial" onclick="closeDialog()">Voltar</button>
                </div>
            </dialog>

            <!-- Título e subtítulo para o conteúdo principal -->
            <h1 class="font-reader" id="book">Livro</h1>
            <h2 class="font-reader" id="chapter"></h2>
            <div id="loader" class="loader"></div>
        </article>
    </main>

    <!-- Navegação de capítulos -->
    <!-- <div class="btns">
        <button onclick="PreviousChapter()" class="chapter">Capítulo Anterior</button>
        <button onclick="NextChapter()" class="chapter">Próximo Capítulo</button>
    </div> -->

    <footer>
    <nav id="buttonBar">
        <ul>
            <li><button onclick="PreviousChapter()" class="chapter">Capítulo Anterior</button></li>
            <li> <button onclick="NextChapter()" class="chapter">Próximo Capítulo</button></li>
        </ul>
        <ul>
            <li><button onclick="darkMode()" class="chapterSmall">
            <i id="darkMode" class="fa fa-toggle-on" style="font-size:2rem;"></i>
        </button></li>
            <li><button id="increaseFontSizeBtn" onclick="increaseFontSize()">A+</button></li>
            <li><button id="decreaseFontSizeBtn" onclick="decreaseFontSize()">A-</button></li>
            <li><button onclick="goToInfo()">Info</button></li>
            <li><select class="chapter" onchange="bibleTranslation()" name="version" id="version">
            <option value="aa">Almeida Atualizada</option>
            <option value="ara">Almeida Revista e Atualizada</option>
            <option value="acf">Almeida Corrigida Fiel</option>
            <option value="nvi">Nova Versão Internacional</option>
        </select></li>
        </ul>
    </nav>
    </footer>
